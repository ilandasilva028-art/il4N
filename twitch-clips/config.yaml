twitch_api:
  client_id_env: TWITCH_CLIENT_ID
  client_secret_env: TWITCH_CLIENT_SECRET
youtube:
  api_key_env: YOUTUBE_API_KEY
  channel_ids: []
  max_results: 10
recording:
  quality: 720p60,720p,best
  segment_seconds: 30
  buffer_minutes: 20
detection:
  bucket_seconds: 10
  warmup_buckets: 6
  history_buckets: 30
  min_messages: 5
  ratio: 3.0
  hype_ratio: 3.0
  hype_min_messages: 25
  cooldown_seconds: 90
  chat_lag_seconds: 6
  window_before: 45
  window_after: 20
  ast_on_candidates: true
scoring:
  weights:
    interest: 25
    reaction: 20
    chat: 15
    surprise: 15
    audio: 10
    dialogue: 10
    technical: 5
  priority: 80
  review: 65
cut:
  min: 15
  max: 35
  target: 25
render:
  fps: 30
  crf: 21
  preset: medium
  max_parallel: 1
subtitles:
  whisper_model: small
