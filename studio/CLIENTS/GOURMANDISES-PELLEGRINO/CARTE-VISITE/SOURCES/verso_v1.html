<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Les Gourmandises Pellegrino — carte de visite v1 (maquette) — verso 85×55 mm : planning des marchés (texte du client, à l'identique),
     QR vers https://www.instagram.com/lesgourmandisespellegrino/, Instagram et e-mail fournis. -->
<link rel="stylesheet" href="print-base.css">
<style>
  @font-face { font-family: Script; src: url(fonts/GreatVibes-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Inter; src: url(fonts/Inter-900.ttf); font-weight: 900; }
  @font-face { font-family: Inter; src: url(fonts/Inter-800.ttf); font-weight: 800; }
  @font-face { font-family: Inter; src: url(fonts/Inter-700.ttf); font-weight: 700; }
  @font-face { font-family: Inter; src: url(fonts/Inter-600.ttf); font-weight: 600; }
  :root { --w: 85mm; --h: 55mm; --bleed: 3mm; --safe: 4mm; --bg: #f4ece2; }
  .bleed { background: #f4ece2; }
  .trim { font-family: Inter, sans-serif; color: #1a1412; }
  .titre { position: absolute; left: 5.4mm; top: 4.8mm; font-family: Script, cursive; font-size: 17pt; line-height: 1; color: #b0704b; }
  .sous { position: absolute; left: 4.8mm; top: 11.4mm; font-size: 6.8pt; font-weight: 800; letter-spacing: .12em; color: #1a1412; }
  .semaine { position: absolute; left: 4.6mm; top: 15.2mm; width: 55mm; display: grid; gap: .7mm; }
  .j { display: grid; grid-template-columns: 9.6mm 1fr; gap: 1.6mm; align-items: center; font-size: 7.3pt; font-weight: 700; line-height: 1.1; }
  .j i { font-style: normal; background: #1a1412; color: #d89a73; border-radius: 1mm; padding: .5mm 0; text-align: center; font-size: 6.8pt; font-weight: 900; letter-spacing: .06em; }
  .j em { font-style: normal; font-weight: 600; color: #8a5a3d; }
  .qr { position: absolute; right: 4.6mm; top: 15.2mm; width: 17.6mm; text-align: center; }
  .qr .fond { background: #fffaf3; border: .3mm solid #c98a63; border-radius: 1.4mm; padding: .7mm; }
  .qr img { display: block; width: 100%; }
  .qr span { display: block; font-size: 6.8pt; font-weight: 800; color: #8a5a3d; margin-top: .6mm; }
  .bas { position: absolute; left: 4.6mm; right: 4.6mm; bottom: 4.2mm; display: grid; gap: .5mm;
         border-top: .25mm solid #dccab7; padding-top: 1.2mm; font-size: 6.9pt; font-weight: 700; }
  .bas div { display: flex; align-items: center; gap: 1.2mm; white-space: nowrap; }
  .bas svg { width: 2.8mm; height: 2.8mm; flex: none; }
</style></head>
<body><div class="page">
  <div class="bleed"></div>
  <div class="trim" style="outline:none">
    <div class="titre">Retrouvez-moi</div>
    <div class="sous">SUR LES MARCHÉS</div>
    <div class="semaine">
      <div class="j"><i>MAR</i><span>Vaison-la-Romaine <em>· soir : Velleron</em></span></div>
      <div class="j"><i>MER</i><span>Saint-Rémy-de-Provence</span></div>
      <div class="j"><i>JEU</i><span>Nyons</span></div>
      <div class="j"><i>VEN</i><span><em>soir :</em> Velleron</span></div>
      <div class="j"><i>SAM</i><span>Uzès</span></div>
      <div class="j"><i>DIM</i><span>L’Isle-sur-la-Sorgue</span></div>
    </div>
    <div class="qr"><div class="fond"><img src="qr_instagram.svg" alt=""></div><span>INSTAGRAM</span></div>
    <div class="bas">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#b0704b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="#b0704b"/></svg>@lesgourmandisespellegrino</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#b0704b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>lesgourmandisespellegrino@gmail.com</div>
    </div>
  </div>
</div></body></html>
