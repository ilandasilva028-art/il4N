<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Carte de visite IL4N v8 « LE BAT » — recto : premier jet (BAT n°1) corrigé au stylo rouge. Retourner la carte = la version validée. -->
<link rel="stylesheet" href="print-base.css">
<style>
  @font-face { font-family: Inter; src: url(fonts/Inter-900.ttf); font-weight: 900; }
  @font-face { font-family: Inter; src: url(fonts/Inter-600.ttf); font-weight: 600; }
  @font-face { font-family: Inter; src: url(fonts/Inter-500.ttf); font-weight: 500; }
  @font-face { font-family: Accent; src: url(fonts/Gelasio-Italic-400.ttf); font-weight: 400; }
  @font-face { font-family: Mono; src: url(fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
  @font-face { font-family: Marker; src: url(fonts/PermanentMarker-Regular.ttf); font-weight: 400; }
  :root { --w: 85mm; --h: 55mm; --bleed: 3mm; --safe: 4mm; --bg: #f4f0e8; --rouge: #d2321f; }
  .bleed { background: #f4f0e8; }
  .trim { font-family: Inter, sans-serif; color: #17131d; }
  svg.calque { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .entete { position: absolute; left: 4mm; top: 4.3mm; font-family: Mono; font-weight: 700; font-size: 5.6pt; color: #8b8590; letter-spacing: .02em; white-space: nowrap; }
  .entete b { font-weight: 700; color: var(--rouge); }
  /* le « premier jet » : volontairement sage */
  .logo-vide { position: absolute; left: 9mm; top: 13mm; width: 15mm; height: 15mm; background: #e4ded2; }
  .logo-vide span { position: absolute; left: 0; right: 0; top: 5.6mm; text-align: center; font-family: Mono; font-weight: 700; font-size: 5.2pt; color: #8b8590; }
  .nom { position: absolute; left: 28mm; top: 15.2mm; font-size: 8.4pt; font-weight: 500; color: #6f6a73; white-space: nowrap; }
  .metier { position: absolute; left: 28mm; top: 20.6mm; font-family: Accent; font-size: 7pt; color: #8b8590; white-space: nowrap; }
  .tel { position: absolute; left: 28mm; top: 25mm; font-size: 6.4pt; font-weight: 500; color: #8b8590; white-space: nowrap; }
  /* corrections au stylo rouge */
  .main { position: absolute; font-family: Marker; color: var(--rouge); line-height: 1; white-space: nowrap; }
  .tourne { position: absolute; right: 4mm; bottom: 4.2mm; font-family: Inter; font-weight: 900; font-size: 8pt; color: #fffdf8; background: #17131d; padding: 1.3mm 2.2mm 1.2mm; border-radius: 3mm; letter-spacing: .02em; white-space: nowrap; }
  .tourne b { font-weight: 900; color: #d6a96a; }
  .bas { position: absolute; left: 4mm; bottom: 4.6mm; font-family: Mono; font-weight: 700; font-size: 5.6pt; color: #8b8590; white-space: nowrap; }
</style></head>
<body><div class="page">
  <div class="bleed"></div>
  <div class="trim">
    <!-- repères de mise en page (cyan) + traits de coupe décoratifs -->
    <svg class="calque" viewBox="0 0 85 55">
      <g stroke="#4bb3d3" stroke-width=".18" fill="none">
        <line x1="9" y1="9" x2="9" y2="43"/><line x1="76" y1="9" x2="76" y2="43"/>
        <line x1="9" y1="9" x2="76" y2="9"/><line x1="9" y1="34" x2="76" y2="34"/>
        <line x1="28" y1="11" x2="28" y2="32"/>
      </g>
      <!-- croix du bloc logo vide -->
      <g stroke="#cfc7b8" stroke-width=".25"><line x1="9" y1="13" x2="24" y2="28"/><line x1="24" y1="13" x2="9" y2="28"/></g>
      <!-- corrections -->
      <g stroke="#d2321f" stroke-width=".55" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- cercle autour du nom -->
        <path d="M26.8 16.6c1.4-2.6 9-3.4 15.6-2.6 4.6.6 6 2.4 4.8 4.2-1.6 2.3-9.8 3-16.4 2.1-3.8-.5-5.4-1.9-4.2-3.4.5-.6 1.6-1.1 3-1.4"/>
        <!-- flèche nom -> + GROS -->
        <path d="M48.2 16.4c2.4-1.4 4.6-2 7.2-2"/><path d="M53.6 12.6l1.9 1.6-2.2 1.3"/>
        <!-- barre « graphiste » -->
        <path d="M27.8 22.3c3.2-.3 6.6-.2 9.6-.5"/>
        <!-- flèche vers logo vide -->
        <path d="M14.2 36.2c-1.6-2.2-1.8-4.2-.6-6.6"/><path d="M12 30.8l1.6-1.6 1.2 2"/>
        <!-- soulignement « tel » -->
        <path d="M27.8 28.5c4.2-.4 9-.3 13.6-.5"/>
      </g>
    </svg>
    <div class="entete">IL4N_carte_V1.pdf · BAT N°1 · <b>À CORRIGER</b></div>

    <div class="logo-vide"><span>LOGO ?</span></div>
    <div class="nom">Ilan Da Silva</div>
    <div class="metier">graphiste</div>
    <div class="tel">06 10 55 71 25</div>

    <div class="main" style="left:57.4mm; top:11.4mm; font-size:10.5pt; transform:rotate(-6deg)">+ GROS !</div>
    <div class="main" style="left:41mm; top:20mm; font-size:6.6pt; transform:rotate(-4deg)">& sites web !</div>
    <div class="main" style="left:43.2mm; top:26.6mm; font-size:6.6pt; transform:rotate(-3deg)"><svg viewBox="0 0 10 6" style="width:2.6mm;height:1.6mm;vertical-align:-.1mm;margin-right:.6mm"><path d="M9.4 3H1.2M3.6.8 1 3l2.6 2.2" fill="none" stroke="#d2321f" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>appelle-moi</div>
    <div class="main" style="left:10.4mm; top:36.6mm; font-size:7.6pt; transform:rotate(-3deg)">Trop sage. On ose ?</div>

    <div class="bas">Faites bonne impression.</div>
    <div class="tourne">TOURNE LA CARTE <svg viewBox="0 0 10 6" style="width:3mm;height:1.8mm;vertical-align:.1mm;margin-left:.6mm"><path d="M.6 3h8.2M6.4.8 9 3 6.4 5.2" fill="none" stroke="#d6a96a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div></body></html>
