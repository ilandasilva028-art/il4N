<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Carte de visite IL4N v9 « CALENDRIER 2027 » — recto : la carte de visite (le calendrier est au dos). -->
<link rel="stylesheet" href="print-base.css">
<style>
  @font-face { font-family: Inter; src: url(fonts/Inter-900.ttf); font-weight: 900; }
  @font-face { font-family: Inter; src: url(fonts/Inter-800.ttf); font-weight: 800; }
  @font-face { font-family: Inter; src: url(fonts/Inter-700.ttf); font-weight: 700; }
  @font-face { font-family: Accent; src: url(fonts/Gelasio-Italic-400.ttf); font-weight: 400; }
  @font-face { font-family: Mono; src: url(fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
  :root { --w: 85mm; --h: 55mm; --bleed: 3mm; --safe: 4mm; --bg: #111018; --or: #d6a96a; }
  .bleed { background: #111018; }
  .trim { font-family: Inter, sans-serif; color: #fffdf8; }
  .entete { position: absolute; left: 5mm; top: 4.3mm; font-family: Mono; font-weight: 700; font-size: 5.6pt; color: #8d8796; letter-spacing: .02em; white-space: nowrap; }
  .entete b { font-weight: 700; color: var(--or); }
  .logo { position: absolute; left: 4.6mm; top: 6.4mm; font-size: 30pt; font-weight: 900; letter-spacing: -.09em; line-height: 1; }
  .logo b { display: inline-block; width: 2.6mm; height: 2.6mm; border-radius: 50%; background: var(--or); margin-left: .7mm; }
  .slogan { position: absolute; left: 5mm; top: 18.4mm; font-family: Accent; font-size: 9.6pt; color: var(--or); white-space: nowrap; }
  .nom { position: absolute; left: 5mm; top: 26.4mm; font-size: 10.5pt; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; }
  .metier { position: absolute; left: 5mm; top: 31.3mm; font-size: 5.8pt; font-weight: 800; letter-spacing: .04em; color: var(--or); white-space: nowrap; }
  .contacts { position: absolute; left: 5mm; top: 35.2mm; display: grid; row-gap: 1.05mm; font-size: 6.6pt; font-weight: 700; }
  .contacts div { display: flex; align-items: center; gap: 1.4mm; white-space: nowrap; }
  .contacts svg { width: 2.6mm; height: 2.6mm; flex: none; }
  .qr { position: absolute; right: 5mm; top: 27.6mm; width: 16mm; }
  .qr .fond { background: #fffdf8; border-radius: 1.2mm; padding: .7mm; }
  .qr img { display: block; width: 100%; }
  .qr span { display: block; text-align: center; font-size: 5.8pt; font-weight: 800; color: var(--or); margin-top: .6mm; letter-spacing: .04em; }
  .tampon { position: absolute; right: 4.4mm; top: 6.6mm; transform: rotate(-8deg); border: .5mm solid var(--or); border-radius: 1.4mm; padding: .8mm 1.8mm .7mm; text-align: center; color: var(--or); }
  .tampon b { display: block; font-size: 9pt; font-weight: 900; letter-spacing: .06em; line-height: 1; }
  .tampon span { display: block; font-family: Mono; font-weight: 700; font-size: 4.6pt; letter-spacing: .04em; margin-top: .4mm; }
  .garde { position: absolute; right: 5mm; top: 6.2mm; width: 20mm; border: .35mm solid var(--or); border-radius: 1.4mm; text-align: center; padding: 1mm 0 1.1mm; color: var(--or); }
  .garde b { display: block; font-size: 11pt; font-weight: 900; letter-spacing: -.02em; line-height: 1; color: #fffdf8; }
  .garde span { display: block; font-size: 4.9pt; font-weight: 800; letter-spacing: .05em; margin-top: .6mm; line-height: 1.25; }
</style></head>
<body><div class="page">
  <div class="bleed"></div>
  <div class="trim">
    <div class="garde"><b>2027</b><span>CALENDRIER<br>AU DOS</span></div>
    <div class="logo">il4n<b></b></div>
    <div class="slogan">Faites bonne impression.</div>
    <div class="nom">Ilan Da Silva</div>
    <div class="metier">GRAPHISTE &amp; SITES WEB · SARRIANS</div>
    <div class="contacts">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>06 10 55 71 25</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="#d6a96a"/></svg>@il4n_studio</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>ilandasilva028@gmail.com</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>il4nstudio.netlify.app</div>
    </div>
    <div class="qr"><div class="fond"><img src="qr.svg" alt=""></div><span>MES TARIFS</span></div>
  </div>
</div></body></html>
