<link rel="stylesheet" href="print-base.css">
<style>

  :root { --w: 148mm; --h: 105mm; --bleed: 3mm; --safe: 5mm; --bg: #111018; --or: #d6a96a; }

  .slogan { position: absolute; left: 10.2mm; top: 29.5mm; font-family: Accent; font-size: 15pt; color: var(--or); white-space: nowrap; }

  .dos b { color: var(--or); font-weight: 800; }
  .qr { position: absolute; left: 110mm; top: 49.8mm; width: 22mm; text-align: center; }
  .qr .fond { background: #fffdf8; border-radius: 2mm; padding: 1.2mm; }
  .qr img { display: block; width: 100%; }
  .qr span { display: block; font-size: 8pt; font-weight: 900; letter-spacing: .06em; color: #111018; margin-top: 1.3mm; white-space: nowrap; }
</style></head>
