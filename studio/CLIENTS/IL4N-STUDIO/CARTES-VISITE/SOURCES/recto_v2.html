<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Carte « billet » IL4N — recto. Dessin original (aucun élément de billet réel : ni €, ni symbole européen, format carte de visite).
     ?n=0007 affiche un numéro de série ; sans paramètre : « IL4N · 2026 ». -->
<link rel="stylesheet" href="print-base.css">
<style>
  @font-face { font-family: Inter; src: url(fonts/Inter-900.ttf); font-weight: 900; }
  @font-face { font-family: Inter; src: url(fonts/Inter-800.ttf); font-weight: 800; }
  @font-face { font-family: Inter; src: url(fonts/Inter-700.ttf); font-weight: 700; }
  @font-face { font-family: Inter; src: url(fonts/Inter-600.ttf); font-weight: 600; }
  @font-face { font-family: Accent; src: url(fonts/Gelasio-Italic-400.ttf); font-weight: 400; }
  :root { --w: 85mm; --h: 55mm; --bleed: 3mm; --safe: 4mm; --bg: #111018; }
  .bleed { background: #111018; }
  .bleed img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .trim { font-family: Inter, sans-serif; color: #fffdf8; }
  .cadre { position: absolute; inset: 0; width: 85mm; height: 55mm; }
  .med { position: absolute; left: 6.2mm; top: 12.6mm; width: 31mm; height: 31mm; }
  .med img { width: 100%; height: 100%; display: block; }
  .med .coeur { position: absolute; left: 50%; top: 50%; width: 17mm; height: 17mm; margin: -8.5mm 0 0 -8.5mm; border-radius: 50%;
                background: #111018; border: .35mm solid #d6a96a; display: flex; align-items: center; justify-content: center; }
  .logo { font-size: 15pt; font-weight: 900; letter-spacing: -.09em; line-height: 1; padding-left: .6mm; }
  .logo b { display: inline-block; width: 1.25mm; height: 1.25mm; border-radius: 50%; background: #d6a96a; margin-left: .35mm; }
  .haut { position: absolute; left: 7.6mm; right: 7.6mm; top: 6.6mm; display: flex; justify-content: space-between; align-items: baseline; }
  .emetteur { font-size: 6.8pt; font-weight: 800; letter-spacing: .2em; color: #d6a96a; }
  .serie { font-size: 7.5pt; font-weight: 800; letter-spacing: .08em; color: #e9c48f; font-variant-numeric: tabular-nums; }
  .titre { position: absolute; left: 39.5mm; top: 13.2mm; font-family: Accent, Georgia, serif; font-size: 10.5pt; color: #d6a96a; line-height: 1.05; }
  .valeur { position: absolute; left: 39mm; top: 21.4mm; display: flex; align-items: center; gap: 2mm; }
  .valeur .un { font-size: 40pt; font-weight: 900; color: #d6a96a; line-height: .8; letter-spacing: -.04em; }
  .valeur .quoi { font-size: 9pt; font-weight: 900; line-height: 1.12; letter-spacing: .03em; }
  .valeur .quoi span { display: block; font-size: 6.8pt; font-weight: 700; color: #c9c3cc; letter-spacing: .04em; margin-top: .6mm; }
  .bas { position: absolute; left: 7.6mm; right: 7.6mm; bottom: 6.3mm; white-space: nowrap; display: flex; justify-content: space-between; font-size: 6.8pt; font-weight: 600; color: #c9c3cc; }
  .coin { position: absolute; right: 7.2mm; bottom: 10.6mm; width: 7mm; height: 7mm; border-radius: 50%; border: .3mm solid #d6a96a;
          display: flex; align-items: center; justify-content: center; font-size: 10pt; font-weight: 900; color: #d6a96a; }
</style></head>
<body><div class="page">
  <div class="bleed"><img src="vagues_nuit.svg" alt=""></div>
  <div class="trim" style="outline:none">
    <svg class="cadre" viewBox="0 0 85 55">
      <rect x="4" y="4" width="77" height="47" rx="1.6" fill="none" stroke="#d6a96a" stroke-width=".35"/>
      <rect x="4.9" y="4.9" width="75.2" height="45.2" rx="1.1" fill="none" stroke="#9c7a4c" stroke-width=".14"/>
      <g fill="#d6a96a"><circle cx="4" cy="4" r=".9"/><circle cx="81" cy="4" r=".9"/><circle cx="4" cy="51" r=".9"/><circle cx="81" cy="51" r=".9"/></g>
    </svg>
    <div class="haut"><span class="emetteur">IL4N STUDIO · SARRIANS</span><span class="serie" id="serie">IL4N · 2026</span></div>
    <div class="med"><img src="rosace_or.svg" alt=""><div class="coeur"><span class="logo">il4n<b></b></span></div></div>
    <div class="titre">Billet de<br>bonne impression</div>
    <div class="valeur"><span class="un">1</span><span class="quoi">MAQUETTE<br>GRATUITE<span>flyer · menu · carte · site</span></span></div>
    <div class="coin">1</div>
    <div class="bas"><span>Vous validez avant de payer</span><span>Sans valeur monétaire</span></div>
  </div>
</div>
<script>
  const n = new URLSearchParams(location.search).get('n');
  if (n) document.getElementById('serie').textContent = 'N° ' + n;
</script>
</body></html>
