<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Carte IL4N v10 « CALENDRIER 2027 » format A6 paysage 148×105 — recto : carte de visite sur fond nuit avec cercles ton sur ton. -->
<link rel="stylesheet" href="print-base.css">
<style>
  @font-face { font-family: Inter; src: url(fonts/Inter-900.ttf); font-weight: 900; }
  @font-face { font-family: Inter; src: url(fonts/Inter-800.ttf); font-weight: 800; }
  @font-face { font-family: Inter; src: url(fonts/Inter-700.ttf); font-weight: 700; }
  @font-face { font-family: Accent; src: url(fonts/Gelasio-Italic-400.ttf); font-weight: 400; }
  :root { --w: 148mm; --h: 105mm; --bleed: 3mm; --safe: 5mm; --bg: #111018; --or: #d6a96a; }
  html, body { height: 112mm; width: 155mm; } /* déborde d'1 mm : évite un liseré blanc au bord du PDF */
  .bleed { background: #111018; }
  .bleed svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .trim { font-family: Inter, sans-serif; color: #fffdf8; }
  .logo { position: absolute; left: 10mm; top: 11mm; font-size: 56pt; font-weight: 900; letter-spacing: -.09em; line-height: 1; }
  .logo b { display: inline-block; width: 4.8mm; height: 4.8mm; border-radius: 50%; background: var(--or); margin-left: 1.2mm; }
  .slogan { position: absolute; left: 10.6mm; top: 33.5mm; font-family: Accent; font-size: 17pt; color: var(--or); white-space: nowrap; }
  .nom { position: absolute; left: 10.6mm; top: 48mm; font-size: 19pt; font-weight: 900; letter-spacing: -.01em; white-space: nowrap; }
  .metier { position: absolute; left: 10.6mm; top: 57mm; font-size: 9.6pt; font-weight: 800; letter-spacing: .05em; color: var(--or); white-space: nowrap; }
  .contacts { position: absolute; left: 10.6mm; top: 65.5mm; display: grid; row-gap: 2.2mm; font-size: 11.5pt; font-weight: 700; }
  .contacts div { display: flex; align-items: center; gap: 2.6mm; white-space: nowrap; }
  .contacts svg { width: 4.6mm; height: 4.6mm; flex: none; }
  .garde { position: absolute; right: 10mm; top: 11mm; width: 34mm; border: .5mm solid var(--or); border-radius: 2.4mm; text-align: center; padding: 2mm 0 2.2mm; color: var(--or); background: #111018; }
  .garde b { display: block; font-size: 19pt; font-weight: 900; letter-spacing: -.02em; line-height: 1; color: #fffdf8; }
  .garde span { display: block; font-size: 8pt; font-weight: 800; letter-spacing: .06em; margin-top: 1.2mm; line-height: 1.25; }
  .qr { position: absolute; right: 13mm; top: 49mm; width: 28mm; }
  .qr .fond { background: #fffdf8; border-radius: 2mm; padding: 1.2mm; }
  .qr img { display: block; width: 100%; }
  .qr span { display: block; text-align: center; font-size: 9pt; font-weight: 800; color: var(--or); margin-top: 1.2mm; letter-spacing: .05em; }
</style></head>
<body><div class="page">
  <div class="bleed">
    <!-- cercles ton sur ton (nuit légèrement éclaircie), centrés sur le QR : discrets, presque invisibles -->
    <svg viewBox="0 0 154 111">
      <circle cx="122" cy="67" r="46" fill="#17151f"/>
      <circle cx="122" cy="67" r="31" fill="#1b1825"/>
      <circle cx="122" cy="67" r="60" fill="none" stroke="#1b1825" stroke-width=".6"/>
      <circle cx="122" cy="67" r="74" fill="none" stroke="#17151f" stroke-width=".6"/>
    </svg>
  </div>
  <div class="trim">
    <div class="logo">il4n<b></b></div>
    <div class="slogan">Faites bonne impression.</div>
    <div class="nom">Ilan Da Silva</div>
    <div class="metier">GRAPHISTE &amp; SITES WEB · SARRIANS</div>
    <div class="contacts"><div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>06 10 55 71 25</div><div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="#d6a96a"/></svg>@il4n_studio</div><div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>ilandasilva028@gmail.com</div><div><svg viewBox="0 0 24 24" fill="none" stroke="#d6a96a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>il4nstudio.netlify.app</div></div>
    <div class="garde"><b>2027</b><span>CALENDRIER<br>AU DOS</span></div>
    <div class="qr"><div class="fond"><img src="qr.svg" alt=""></div><span>MES TARIFS</span></div>
  </div>
</div></body></html>
