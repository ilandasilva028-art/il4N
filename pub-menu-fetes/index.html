<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IL4N — Pub menu de fêtes</title>
<style>
  /* Deux familles : Inter (titres + UI, comme le site) et Gelasio italique (équivalent libre de Georgia, le mot doré du site). */
  @font-face { font-family: Display; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
  @font-face { font-family: Display; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
  @font-face { font-family: Display; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: Display; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
  @font-face { font-family: Display; src: url(fonts/Inter-ExtraBold.otf); font-weight: 800; }
  @font-face { font-family: Display; src: url(fonts/Inter-Black.otf); font-weight: 900; }
  @font-face { font-family: Accent; src: url(fonts/accent.woff2) format('woff2'); font-weight: 400; font-style: normal; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">espace : lecture/pause · ←/→ : image par image · clic : se déplacer</div>
<script type="module" src="film.js"></script>
</body>
</html>
